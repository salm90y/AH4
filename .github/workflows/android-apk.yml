name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "APK variant to build"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "app/**"
      - "assets/**"
      - "components/**"
      - "constants/**"
      - "hooks/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.config.ts"
      - "babel.config.js"
      - "metro.config.js"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ${{ inputs.variant || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      BUILD_VARIANT: ${{ inputs.variant || 'debug' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Select APK output
        id: apk
        run: |
          if [ "$BUILD_VARIANT" = "release" ]; then
            echo "gradle_task=:app:assembleRelease" >> "$GITHUB_OUTPUT"
            echo "artifact_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=AH4-Watch-Party-release" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_task=:app:assembleDebug" >> "$GITHUB_OUTPUT"
            echo "artifact_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=AH4-Watch-Party-debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew ${{ steps.apk.outputs.gradle_task }} --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
