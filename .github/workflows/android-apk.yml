name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "APK type to build"
        required: true
        default: standalone
        type: choice
        options:
          - standalone
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "app/**"
      - "assets/**"
      - "components/**"
      - "constants/**"
      - "hooks/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.config.ts"
      - "plugins/**"
      - "babel.config.js"
      - "metro.config.js"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ${{ inputs.variant || 'standalone' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: "https://api.ahmed1986y.com"
      BUILD_VARIANT: ${{ inputs.variant || 'standalone' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone APK with embedded JavaScript
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify embedded JavaScript bundle
        id: apk
        run: |
          apk_path=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$apk_path"
          unzip -l "$apk_path" | grep -q 'assets/index.android.bundle'
          mkdir -p dist
          cp "$apk_path" dist/AH4-Watch-Party-standalone.apk
          echo "artifact_path=dist/AH4-Watch-Party-standalone.apk" >> "$GITHUB_OUTPUT"
          echo "artifact_name=AH4-Watch-Party-standalone" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
